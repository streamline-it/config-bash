---
- name: ensure termcap lines exist in .bashrc
  loop: "{{ config_bash_user_accts | product(config_bash_bashrc_termcap_colors) | list }}"
  ansible.builtin.lineinfile:
    path: "{{ item[0]['homedir'] }}/{{ config_bash_bashrc_filename }}"
    regex: "{{ item[1]['regex'] }}"
    line: "{{ item[1]['line'] }}"
    state: present
